# 已有部署兼容模板：保持原服务、Secret 和环境变量，供无操作升级使用。
services:
  bmc-server:
    # Server 镜像地址
    image: ${BMC_SERVER_IMAGE:-wdjoys/backup-management-center-server:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: Dockerfile.server
      args:
        # 构建版本号
        VERSION: ${VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      # Web / HTTP API 监听绑定地址与宿主机端口（兼容模式默认 0.0.0.0:443）
      - "${BMC_SERVER_BIND:-0.0.0.0}:${BMC_SERVER_PORT:-443}:8080"
      # Agent gRPC 控制面监听绑定地址与宿主机端口（兼容模式默认 0.0.0.0:9090）
      - "${BMC_GRPC_BIND:-0.0.0.0}:${BMC_GRPC_PORT:-9090}:9090"
      # Prometheus 指标默认不发布（仅容器本地）。如需宿主机采集，取消注释并同时把
      # BMC_METRICS_ADDR 设为 :9100。
      # - "${BMC_METRICS_BIND:-127.0.0.1}:${BMC_METRICS_PORT:-9100}:9100"
    environment:
      # TLS 模式：auto（自动启用 TLS，生产环境需挂载证书）或 none（不启用 TLS）
      BMC_TLS_MODE: ${BMC_TLS_MODE:-auto}
      # 容器内 Web / HTTP API 监听地址
      BMC_LISTEN_ADDR: ":8080"
      # 容器内 Agent gRPC 控制通道监听地址
      BMC_GRPC_ADDR: ":9090"
      # 容器内 Prometheus 指标监听地址（默认仅容器本地；如需宿主机采集，设为 :9100 并发布端口）
      BMC_METRICS_ADDR: ${BMC_METRICS_ADDR:-127.0.0.1:9100}
      # 容器内持久化数据目录（存放 SQLite 数据库等）
      BMC_DATA_DIR: /var/lib/bmc
      # BMC 对外公开访问的根 URL（供 Web 控制台、回调及 Agent 下载凭据等引用，结尾不加斜杠）。
      # 必填：留空会让通知链接与 Secure cookie 判定缺少公网地址；此处刻意不给占位默认值，
      # 避免误部署时静默使用错误地址。
      BMC_PUBLIC_URL: ${BMC_PUBLIC_URL:-}
      # 已通过真实隔离实例验证的数据库恢复类型（逗号分隔，默认全部禁用）
      BMC_DATABASE_RESTORE_KINDS: ${BMC_DATABASE_RESTORE_KINDS:-}
      # 运行历史（runs/日志/审计事件）保留天数，0（默认）表示永久保留
      BMC_HISTORY_RETENTION_DAYS: ${BMC_HISTORY_RETENTION_DAYS:-0}
      # 仅本地开发用：1 允许缺少 TLS 证书启动（生产必须保持 0）
      BMC_DEV_INSECURE: ${BMC_DEV_INSECURE:-0}
      # 主密钥文件路径（用于加解密存储目标凭证与通信密钥，兼容模式由 Docker Secret 注入）
      BMC_MASTER_KEY_FILE: /run/secrets/bmc_master_key
      # TLS 证书文件路径（兼容模式由 Docker Secret 注入）
      BMC_TLS_CERT_FILE: /run/secrets/bmc_tls_cert
      # TLS 私钥文件路径（兼容模式由 Docker Secret 注入）
      BMC_TLS_KEY_FILE: /run/secrets/bmc_tls_key
    volumes:
      - bmc-data:/var/lib/bmc
    secrets:
      - bmc_master_key
      - bmc_tls_cert
      - bmc_tls_key
    read_only: true
    # 与 docker-compose.yml 同理：tmpfs 默认归 root:root，显式写 mode=0700 时必须同时
    # 指定 uid/gid，否则 nonroot(65532) 无法写 /tmp，SQLite 报 6410 (GETTEMPPATH)。
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    security_opt:
      - no-new-privileges:true
volumes:
  bmc-data:
secrets:
  # 宿主机主密钥文件路径（32 字节 master.key）
  bmc_master_key:
    file: ${BMC_MASTER_KEY_FILE:-./secrets/master.key}
  # 宿主机 TLS 证书文件路径
  bmc_tls_cert:
    file: ${BMC_TLS_CERT_FILE:-/dev/null}
  # 宿主机 TLS 私钥文件路径
  bmc_tls_key:
    file: ${BMC_TLS_KEY_FILE:-/dev/null}
