# Server 部署模板：默认启用 TLS；通过 BMC_TLS_MODE=none 切换为 Caddy 明文回源模式。
# 从 deploy/ 目录执行时，构建上下文固定指向仓库根目录 deploy/..。
services:
  bmc-server:
    image: ${BMC_SERVER_IMAGE:-wdjoys/backup-management-center-server:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: Dockerfile.server
      args:
        VERSION: ${VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      # TLS 模式默认对外暴露 443；Caddy 模式建议设置 BMC_SERVER_BIND=127.0.0.1 并暴露明文 8080。
      - "${BMC_SERVER_BIND:-0.0.0.0}:${BMC_SERVER_PORT:-443}:8080"
      - "${BMC_GRPC_BIND:-0.0.0.0}:${BMC_GRPC_PORT:-9090}:9090"
    environment:
      # auto 从证书 secret 提供 HTTPS 和 TLS gRPC；none 用于由 Caddy 终止 TLS。
      BMC_TLS_MODE: ${BMC_TLS_MODE:-auto}
      BMC_LISTEN_ADDR: ":8080"
      BMC_GRPC_ADDR: ":9090"
      BMC_METRICS_ADDR: "127.0.0.1:9100"
      BMC_DATA_DIR: /var/lib/bmc
      BMC_PUBLIC_URL: ${BMC_PUBLIC_URL:-https://backup.example.com}
      BMC_MASTER_KEY_FILE: /run/secrets/bmc_master_key
      BMC_TLS_CERT_FILE: /run/secrets/bmc_tls_cert
      BMC_TLS_KEY_FILE: /run/secrets/bmc_tls_key
    volumes:
      - bmc-data:/var/lib/bmc
    secrets:
      - bmc_master_key
      - bmc_tls_cert
      - bmc_tls_key
    read_only: true
    tmpfs:
      - /tmp:mode=0700
    security_opt:
      - no-new-privileges:true

volumes:
  bmc-data:

secrets:
  bmc_master_key:
    file: ${BMC_MASTER_KEY_FILE:-./secrets/master.key}
  # 明文 Caddy 模式不会读取证书；默认使用 /dev/null 避免要求无用证书文件。
  # TLS 模式请通过环境变量改为实际证书路径。
  bmc_tls_cert:
    file: ${BMC_TLS_CERT_FILE:-/dev/null}
  bmc_tls_key:
    file: ${BMC_TLS_KEY_FILE:-/dev/null}
