# Caddy 共存模式：公网 80/443 由已有 Caddy 占用。
# BMC 只监听明文端口并仅绑定本机回环，全部 TLS 由 Caddy 终止。
# 用法：docker compose -f docker-compose.server.caddy.yml up -d --build
services:
  bmc-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: backup-management-center-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      BMC_TLS_MODE: none
      BMC_LISTEN_ADDR: ":8080"
      BMC_GRPC_ADDR: ":9090"
      BMC_METRICS_ADDR: "127.0.0.1:9100"
      BMC_DATA_DIR: /var/lib/bmc
      BMC_PUBLIC_URL: ${BMC_PUBLIC_URL:?set https://your-domain}
      BMC_MASTER_KEY_FILE: /run/secrets/bmc_master_key
    volumes:
      - bmc-data:/var/lib/bmc
    secrets:
      - bmc_master_key
    read_only: true
    tmpfs:
      - /tmp:mode=0700
    security_opt:
      - no-new-privileges:true

volumes:
  bmc-data:

secrets:
  bmc_master_key:
    file: ${BMC_MASTER_KEY_FILE:-./secrets/master.key}
