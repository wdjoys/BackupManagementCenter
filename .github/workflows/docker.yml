name: Build and Push Docker Images

# 仅在镜像相关文件变动时构建并推送对应镜像。
on:
  push:
    branches: [main, develop]
    paths:
      - '.dockerignore'
      - 'Dockerfile.server'
      - 'Dockerfile.agent'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/server/**'
      - 'cmd/agent/**'
      - 'internal/**'
      - 'api/**'
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 镜像命名空间：需在仓库 Secrets 中配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/backup-management-center

jobs:
  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      agent: ${{ steps.filter.outputs.agent }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect changed image paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - '.dockerignore'
              - 'Dockerfile.server'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/server/**'
              - 'internal/server/**'
              - 'internal/logging/**'
              - 'internal/model/**'
              - 'internal/secrets/**'
              - 'internal/version/**'
              - 'api/**'
              - 'web/**'
            agent:
              - '.dockerignore'
              - 'Dockerfile.agent'
              - 'go.mod'
              - 'go.sum'
              - 'cmd/agent/**'
              - 'internal/agent/**'
              - 'internal/logging/**'
              - 'internal/model/**'
              - 'internal/version/**'
              - 'api/**'
      - name: Build changed image matrix
        id: matrix
        env:
          SERVER_CHANGED: ${{ steps.filter.outputs.server }}
          AGENT_CHANGED: ${{ steps.filter.outputs.agent }}
        run: |
          images='[]'
          if [ "$SERVER_CHANGED" = 'true' ]; then
            images=$(jq -c '. + [{"image":"server","dockerfile":"Dockerfile.server"}]' <<< "$images")
          fi
          if [ "$AGENT_CHANGED" = 'true' ]; then
            images=$(jq -c '. + [{"image":"agent","dockerfile":"Dockerfile.agent"}]' <<< "$images")
          fi
          echo "matrix=$(jq -cn --argjson include "$images" '{include: $include}')" >> "$GITHUB_OUTPUT"

  test:
    name: Go, race and frontend checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.agent == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit tests
        run: go test ./...
      - name: Go race tests
        run: go test -race ./...
      - name: Set up pnpm
        if: needs.changes.outputs.server == 'true'
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10
      - name: Set up Node
        if: needs.changes.outputs.server == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Frontend typecheck and production build
        if: needs.changes.outputs.server == 'true'
        working-directory: web
        run: pnpm --ignore-workspace install --frozen-lockfile && pnpm --ignore-workspace run build

  build:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [changes, test]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Update develop Compose host
    runs-on: ubuntu-latest
    needs: [changes, test, build]
    if: >-
      always() &&
      github.ref == 'refs/heads/develop' &&
      vars.DEPLOY_ENABLED == 'true' &&
      (needs.build.result == 'success') &&
      (needs.changes.outputs.server == 'true' || needs.changes.outputs.agent == 'true')
    steps:
      - name: Update Compose services
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -eu
            cd '${{ secrets.DEPLOY_PATH }}'
            docker compose pull
            docker compose up -d --no-build --remove-orphans
            curl --fail --silent --show-error --insecure --retry 12 --retry-delay 5 http://localhost:8081/health/ready
