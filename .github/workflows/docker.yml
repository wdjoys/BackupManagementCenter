name: Build and Push Docker Images

# 推送 main / develop 分支时构建 server 与 agent 镜像并推送至 Docker Hub
on:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  # 镜像命名空间：需在仓库 Secrets 中配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
  REGISTRY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/backup-management-center

jobs:
  test:
    name: Go, race and frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Go unit tests
        run: go test ./...
      - name: Go race tests
        run: go test -race ./...
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Frontend typecheck and production build
        working-directory: web
        run: pnpm --ignore-workspace install --frozen-lockfile && pnpm --ignore-workspace run build

  build:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: server
            dockerfile: Dockerfile.server
          - image: agent
            dockerfile: Dockerfile.agent
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}-${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.${{ matrix.image }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
