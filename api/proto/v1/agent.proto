syntax = "proto3";

package bmc.v1;

option go_package = "backupmanagementcenter/api/proto/v1;bmcv1";

// AgentControl is the only wire protocol between Server and Agent.
// Agents always dial outbound; the server never dials agents.
//
// Version handshake: the Connect metadata carries bmc-agent-version; the
// Welcome message carries server_version. Major mismatch rejects the stream,
// minor mismatch connects with a warning flag.
service AgentControl {
  // Enroll consumes a one-time enrollment token and registers a new agent.
  // The agent secret is supplied by the agent (32 random bytes) and only its
  // SHA-256 is persisted server-side.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Connect is the long-lived bidirectional control stream. Authentication is
  // carried in gRPC metadata: bmc-agent-id and bmc-agent-secret (hex encoded).
  rpc Connect(stream AgentMessage) returns (stream ServerMessage);
}

message EnrollRequest {
  string enrollment_token = 1;
  string hostname = 2;
  string os = 3;
  string arch = 4;
  string version = 5;
  // Exactly 32 random bytes generated by the agent at first boot.
  bytes secret = 6;
}

message EnrollResponse {
  string agent_id = 1;
}

message AgentMessage {
  string message_id = 1;
  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    CommandAccepted command_accepted = 12;
    RunProgress run_progress = 13;
    RunLogBatch run_log_batch = 14;
    RunResult run_result = 15;
    CapabilitiesReport capabilities_report = 16;
  }
}

message ServerMessage {
  string message_id = 1;
  oneof payload {
    Welcome welcome = 10;
    ExecuteCommand execute_command = 11;
    CancelCommand cancel_command = 12;
  }
}

// Hello must be the first message on every Connect stream.
message Hello {
  string hostname = 1;
  string os = 2;
  string arch = 3;
  string version = 4;
}

message Welcome {
  string server_version = 1;
  string server_instance_id = 2;
  int32 heartbeat_interval_seconds = 3;
  // True when agent/server minor versions differ (connection allowed, UI warns).
  bool version_minor_mismatch = 4;
}

message Heartbeat {
  int64 unix_nanos = 1;
  double uptime_seconds = 2;
}

// Acknowledge receipt of an ExecuteCommand before execution starts.
message CommandAccepted {
  string command_id = 1;
  string run_id = 2;
}

message RunProgress {
  string run_id = 1;
  string phase = 2;
  double percent = 3;
  int64 bytes_done = 4;
  int64 bytes_total = 5;
  int64 files_done = 6;
  int64 files_total = 7;
  string detail_json = 8;
}

message LogLevel {
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    DEBUG = 1;
    INFO = 2;
    WARN = 3;
    ERROR = 4;
  }
  Level level = 1;
}

message LogEntry {
  uint64 seq = 1;
  int64 timestamp_unix_nanos = 2;
  LogLevel.Level level = 3;
  string message = 4;
}

message RunLogBatch {
  // run_id非空表示运行日志；run_id为空表示Agent进程日志。
  // 复用现有包络以兼容未升级的Agent。
  string run_id = 1;
  repeated LogEntry entries = 2;
}

// Terminal state of a run. Sent exactly once per run_id; re-sent verbatim when
// the server redelivers a command for an already-finished run (idempotency).
message RunResult {
  string run_id = 1;
  Status status = 2;
  string error_code = 3;
  string error_message = 4;
  repeated string snapshot_ids = 5;
  string result_json = 6;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    SUCCEEDED = 1;
    FAILED = 2;
    CANCELLED = 3;
  }
}

message ToolInfo {
	string name = 1;
	string path = 2;
	string version = 3;
}

message PathMapping {
	string host_path = 1;
	string runtime_path = 2;
	bool read_only = 3;
}

message CapabilitiesReport {
  repeated ToolInfo tools = 1;
  repeated PathMapping source_path_mappings = 2;
  repeated PathMapping restore_path_mappings = 3;
}

message ExecuteCommand {
  string command_id = 1;
  string run_id = 2;
  Operation operation = 3;
  // Structured task parameters shared as internal/model JSON payloads keyed by
  // operation. Never contains secrets.
  bytes params_json = 4;
  SecretSet secrets = 5;

  enum Operation {
    OPERATION_UNSPECIFIED = 0;
    BACKUP = 1;
    RESTORE = 2;
    RESTORE_DRY_RUN = 3;
    CHECK = 4;
    FORGET = 5;
    SNAPSHOTS = 6;
    SNAPSHOT_LS = 7;
    VERIFY_STORAGE_REMOTE = 8;
    VALIDATE_PATHS = 9;
    PROBE_CAPABILITIES = 10;
  }
}

// Secrets travel only inside this message over mTLS, never in params_json.
message SecretSet {
  // Full rclone.conf content for the repository's storage target.
  string rclone_conf = 1;
  // Restic repository password.
  string restic_password = 2;
  // Database password for postgresql/mysql/mongodb plans.
  string db_password = 3;
}

message CancelCommand {
  string run_id = 1;
}
