services:
  bmc-server:
    image: ${BMC_SERVER_IMAGE:-wdjoys/backup-management-center-server:latest}
    pull_policy: always
    build:
      context: ..
      dockerfile: Dockerfile.server
      args:
        VERSION: ${VERSION:-0.1.0}
    restart: unless-stopped
    ports:
      - "${BMC_SERVER_BIND:-0.0.0.0}:${BMC_SERVER_PORT:-443}:8080"
      - "${BMC_GRPC_BIND:-0.0.0.0}:${BMC_GRPC_PORT:-9090}:9090"
    environment:
      BMC_TLS_MODE: auto
      BMC_LISTEN_ADDR: ":8080"
      BMC_GRPC_ADDR: ":9090"
      BMC_METRICS_ADDR: "127.0.0.1:9100"
      BMC_DATA_DIR: /var/lib/bmc
      BMC_PUBLIC_URL: ${BMC_PUBLIC_URL:-https://backup.example.com}
      BMC_TLS_CERT_FILE: /run/secrets/bmc_tls_cert
      BMC_TLS_KEY_FILE: /run/secrets/bmc_tls_key
    volumes:
      - bmc-data:/var/lib/bmc
    secrets:
      - bmc_tls_cert
      - bmc_tls_key
    read_only: true
    tmpfs:
      - /tmp:mode=0700
    security_opt:
      - no-new-privileges:true
volumes:
  bmc-data:
secrets:
  bmc_tls_cert:
    file: ${BMC_TLS_CERT_FILE:?set TLS certificate path}
  bmc_tls_key:
    file: ${BMC_TLS_KEY_FILE:?set TLS private key path}
