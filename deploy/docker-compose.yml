# Server 部署模板：推荐由外部反向代理终止公网 TLS 并转发 Web/API 与 gRPC。
services:
  bmc-server:
    # Server 镜像地址
    image: ${BMC_SERVER_IMAGE:-wdjoys/backup-management-center-server:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      # Web / HTTP API 监听绑定地址与宿主机端口（默认绑定本地 127.0.0.1:8080，由外部反向代理转发）
      - "${BMC_SERVER_BIND:-127.0.0.1}:${BMC_SERVER_PORT:-8080}:8080"
      # Agent gRPC 控制面监听绑定地址与宿主机端口（默认绑定本地 127.0.0.1:9090）
      - "${BMC_GRPC_BIND:-127.0.0.1}:${BMC_GRPC_PORT:-9090}:9090"
      # Prometheus 指标默认不发布（仅容器本地）。如需宿主机采集，取消注释并同时把
      # BMC_METRICS_ADDR 设为 :9100（见 deploy/.env.example）。
      # - "${BMC_METRICS_BIND:-127.0.0.1}:${BMC_METRICS_PORT:-9100}:9100"
    environment:
      # TLS 模式：none（反向代理模式，内部纯 HTTP 与纯 gRPC）或 auto（直接加载 TLS 证书）
      BMC_TLS_MODE: none
      # 容器内 Web / HTTP API 监听地址
      BMC_LISTEN_ADDR: ":8080"
      # 容器内 Agent gRPC 控制通道监听地址
      BMC_GRPC_ADDR: ":9090"
      # 容器内 Prometheus 指标监听地址（默认仅容器本地；如需宿主机采集，设为 :9100 并发布端口）
      BMC_METRICS_ADDR: ${BMC_METRICS_ADDR:-127.0.0.1:9100}
      # 容器内持久化数据目录（存放 SQLite 数据库、master.key 等）
      BMC_DATA_DIR: /var/lib/bmc
      # BMC 对外公开访问的根 URL（供 Web 控制台、回调及 Agent 下载凭据等引用，结尾不加斜杠）。
      # 必填：留空会让通知链接与 Secure cookie 判定缺少公网地址；此处刻意不给占位默认值，
      # 避免误部署时静默使用错误地址。
      BMC_PUBLIC_URL: ${BMC_PUBLIC_URL:-}
      # 已通过真实隔离实例验证的数据库恢复类型（逗号分隔，默认全部禁用）。
      # 未列出的类型返回 503，需先验证预备份与回滚后再逐项启用。
      BMC_DATABASE_RESTORE_KINDS: ${BMC_DATABASE_RESTORE_KINDS:-}
      # 运行历史（runs/日志/审计事件）保留天数，0（默认）表示永久保留
      BMC_HISTORY_RETENTION_DAYS: ${BMC_HISTORY_RETENTION_DAYS:-0}
    volumes:
      - bmc-data:/var/lib/bmc
    read_only: true
    # tmpfs 必须显式指定 uid/gid：容器以 nonroot(65532) 运行，而 tmpfs 默认归 root:root，
    # 一旦显式写 mode=0700 就对该用户不可写——服务端会连临时文件都建不出来，
    # SQLite 报 disk I/O error (6410, SQLITE_IOERR_GETTEMPPATH)，
    # 表现为大 limit 的运行列表 500、临时文件相关的迁移/清理失败。
    tmpfs:
      - /tmp:uid=65532,gid=65532,mode=0700
    security_opt:
      - no-new-privileges:true
volumes:
  bmc-data:
